name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private dependency fetch
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/JordiBrisbois/ReUnhideNPCs-RE.git".insteadOf "https://github.com/JordiBrisbois/ReUnhideNPCs-RE.git"
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/JordiBrisbois/ReUnhideNPCs-fw.git".insteadOf "https://github.com/JordiBrisbois/ReUnhideNPCs-fw.git"

      - name: Determine tag version
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=""
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # Every release records the ReUnhideNPCs-RE commit it was built from, so a
      # tag maps to an exact source state instead of floating on "main".
      - name: Read pinned RE commit
        id: re
        shell: bash
        run: |
          if [[ ! -f re-commit.txt ]]; then
            echo "::error::re-commit.txt is missing: a release must pin the ReUnhideNPCs-RE commit"
            exit 1
          fi
          SHA="$(tr -d '[:space:]' < re-commit.txt)"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::re-commit.txt must contain a full 40-character commit SHA, got '$SHA'"
            exit 1
          fi
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building against ReUnhideNPCs-RE $SHA"

      - name: Configure CMake
        shell: bash
        run: |
          EXTRA=()
          EXTRA+=("-DUNPC_RE_COMMIT=${{ steps.re.outputs.SHA }}")
          if [[ -n "${{ steps.tag.outputs.VERSION }}" ]]; then
            EXTRA+=("-DUNPC_VERSION_OVERRIDE=${{ steps.tag.outputs.VERSION }}")
          fi
          cmake -S . -B build \
            -G "Visual Studio 18 2026" \
            -A x64 \
            -DCMAKE_CXX_STANDARD=20 \
            "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Read built version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content build/version.txt -Raw).Trim()
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag") {
            "TAG=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "TAG=v$version" >> $env:GITHUB_OUTPUT
          }

      # GitHub's generated notes only list pull requests, and this project is
      # built from direct pushes, so the release page would otherwise carry
      # nothing but a compare link. Take the section that matches the tag from
      # CHANGELOG.md instead, and fall back to the generated notes when the tag
      # has no section yet.
      - name: Read the matching CHANGELOG section
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          awk -v heading="## v$VERSION" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
            echo "Using the CHANGELOG.md section for v$VERSION"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md has no section for v$VERSION, using generated notes"
          fi

      - name: Verify release assets
        shell: pwsh
        run: |
          $files = @(
            "build/Release/ReUnhideNPCs.dll",
            "build/Release/ReUnhideNPCs.pdb",
            "build/Release/ReUnhideNPCs_ArcDps.dll",
            "build/Release/ReUnhideNPCs_ArcDps.pdb"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing release asset: $file" }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReUnhideNPCs-${{ steps.version.outputs.VERSION }}
          if-no-files-found: error
          path: |
            build/Release/ReUnhideNPCs.dll
            build/Release/ReUnhideNPCs.pdb
            build/Release/ReUnhideNPCs_ArcDps.dll
            build/Release/ReUnhideNPCs_ArcDps.pdb

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          fail_on_unmatched_files: true
          files: |
            build/Release/ReUnhideNPCs.dll
            build/Release/ReUnhideNPCs.pdb
            build/Release/ReUnhideNPCs_ArcDps.dll
            build/Release/ReUnhideNPCs_ArcDps.pdb
