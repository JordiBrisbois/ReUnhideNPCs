name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine tag version
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=""
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        shell: bash
        run: |
          EXTRA=()
          if [[ -n "${{ steps.tag.outputs.VERSION }}" ]]; then
            EXTRA+=("-DUNPC_VERSION_OVERRIDE=${{ steps.tag.outputs.VERSION }}")
          fi
          cmake -S . -B build \
            -G "Visual Studio 18 2026" \
            -A x64 \
            -DCMAKE_CXX_STANDARD=20 \
            "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Read built version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content build/version.txt -Raw).Trim()
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag") {
            "TAG=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "TAG=v$version" >> $env:GITHUB_OUTPUT
          }

      - name: Verify release assets
        shell: pwsh
        run: |
          $files = @(
            "build/Release/ReUnhideNPCs.dll",
            "build/Release/ReUnhideNPCs.pdb",
            "build/Release/ReUnhideNPCs_ArcDps.dll",
            "build/Release/ReUnhideNPCs_ArcDps.pdb"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing release asset: $file" }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReUnhideNPCs-${{ steps.version.outputs.VERSION }}
          if-no-files-found: error
          path: |
            build/Release/ReUnhideNPCs.dll
            build/Release/ReUnhideNPCs.pdb
            build/Release/ReUnhideNPCs_ArcDps.dll
            build/Release/ReUnhideNPCs_ArcDps.pdb

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/Release/ReUnhideNPCs.dll
            build/Release/ReUnhideNPCs.pdb
            build/Release/ReUnhideNPCs_ArcDps.dll
            build/Release/ReUnhideNPCs_ArcDps.pdb
